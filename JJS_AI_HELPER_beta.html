    Object.assign(PTRU, {"<b>Nasıl okunur?</b> <b>Akış</b> skill’in ana sırasıdır. <b>Branch’ler</b> koşula göre açılan yan yollardır. <b>TAG’ler</b> koşul ve sayaçlardır. <b>Diğer</b> hitbox, animasyon, hız gibi detayları türüne göre toplar.": ["<b>Como ler?</b> <b>Fluxo</b> é a sequência principal da skill. <b>Branches</b> são caminhos laterais abertos por condição. <b>Tags</b> são condições e contadores. <b>Outros</b> agrupa hitbox, animação, velocidade e mais por tipo.", "<b>Как читать?</b> <b>Поток</b> — основная последовательность навыка. <b>Ветки</b> — боковые пути по условию. <b>Теги</b> — условия и счётчики. <b>Другое</b> группирует hitbox, анимацию, скорость и прочее по типу."], "TAG: koşul veya sayaç işaretçisi. “Kontrol” değeri okur, “Yazar” değer atar.": ["TAG: marcador de condição ou contador. “Verifica” lê um valor, “Escreve” atribui um.", "TAG: маркер условия или счётчика. «Проверка» читает значение, «Запись» задаёт его."], "Olası eksik branch hedefi: ": ["Possível alvo de branch ausente: ", "Возможно, отсутствует целевая ветка: "], "Kullanılmayan branch: ": ["Branch sem uso: ", "Неиспользуемая ветка: "], "Hasarı 0 olan HITBOX var": ["HITBOX com dano 0", "HITBOX с уроном 0"], "Çok uzun WAIT: ": ["WAIT muito longo: ", "Слишком долгий WAIT: "], "SKILL içinde hiç HITBOX yok": ["A SKILL não tem HITBOX", "В SKILL нет HITBOX"], "Sorun bulunamadı. Yine de oyunda test et.": ["Nenhum problema encontrado. Ainda assim, teste no jogo.", "Проблем не найдено. Всё равно проверьте в игре."], "Açılış (startup)": ["Início (startup)", "Старт (startup)"], "hızlı starter": ["starter rápido", "быстрый старт"], "kontrol/stun": ["controle/stun", "контроль/оглушение"], "finisher/yüksek hasar": ["finisher/dano alto", "финишер/высокий урон"], "Hitbox içeren skill bulunamadı.": ["Nenhuma skill com hitbox encontrada.", "Навыки с hitbox не найдены."], "Build önerisi": ["Sugestão de build", "Предложение билда"], "Starter adayları (en hızlı açılış):": ["Candidatos a starter (início mais rápido):", "Кандидаты в стартеры (самый быстрый старт):"], "Kontrol / combo bağlayıcı (en yüksek stun):": ["Controle / extensores de combo (maior stun):", "Контроль / связки комбо (наибольшее оглушение):"], "Finisher adayları (en yüksek hasar):": ["Candidatos a finisher (maior dano):", "Кандидаты в финишеры (наибольший урон):"], "Önerilen zincir: starter → kontrol → finisher. Stun süresi, sıradaki skill’in açılışından uzun olmalı.": ["Cadeia sugerida: starter → controle → finisher. O stun deve durar mais que o início da próxima skill.", "Рекомендуемая цепочка: старт → контроль → финишер. Оглушение должно длиться дольше старта следующего навыка."], "Koşul/sayaç işaretçisi. CHECK etiketin değerine bakar ve uygunsa BRANCH yoluna gider; SET değer yazar. Counter, cooldown ve combo adımı takibi için kullanılır.": ["Marcador de condição/contador. CHECK lê o valor da tag e vai para o BRANCH se couber; SET escreve um valor. Usado em contadores, cooldowns e passos de combo.", "Маркер условия/счётчика. CHECK читает значение тега и при совпадении идёт в BRANCH; SET записывает значение. Используется для счётчиков, перезарядок и шагов комбо."], "Akışı DATA.Branch içindeki bir anahtara yönlendirir: isabet/ıskalama, combo devamı, koşullu yollar.": ["Direciona o fluxo para uma chave em DATA.Branch: acerto/erro, continuação de combo, caminhos condicionais.", "Направляет поток к ключу в DATA.Branch: попадание/промах, продолжение комбо, условные пути."], "Saldırı alanı. DAMAGE, STUN, boyut, süre ve isabette çalışacak BRANCH gibi alanlar taşır; hasar ve combo hissi buradan gelir.": ["Área de ataque. Leva DAMAGE, STUN, tamanho, duração e um BRANCH executado no acerto; o dano e a sensação de combo vêm daqui.", "Зона атаки. Содержит DAMAGE, STUN, размер, длительность и BRANCH при попадании; урон и ощущение комбо идут отсюда."], "Animasyon oynatır; hareketin görsel akışını belirler.": ["Toca uma animação; define o fluxo visual do movimento.", "Проигрывает анимацию; задаёт визуальный ход движения."], "Akışı TIME saniye bekletir. Startup ve recovery süresini ayarlamanın ana yolu.": ["Pausa o fluxo por TIME segundos. Principal forma de ajustar início e recuperação.", "Приостанавливает поток на TIME секунд. Основной способ настроить старт и восстановление."], "Hareket/savurma hızı verir: dash, knockback, çekme.": ["Aplica velocidade/impulso: dash, knockback, puxão.", "Задаёт скорость/импульс: рывок, отбрасывание, притяжение."], "Karaktere geçici durum verir (ör. hareket kilidi, dayanıklılık). Alan adlarını node özelliklerinden doğrula.": ["Dá ao personagem um estado temporário (ex.: trava de movimento, resistência). Confirme os nomes dos campos nas propriedades do nó.", "Даёт персонажу временное состояние (например, блокировка движения, стойкость). Проверьте названия полей в свойствах узла."], "Ses efekti çalar.": ["Toca um efeito sonoro.", "Проигрывает звуковой эффект."], "Görsel efekt (VFX) oluşturur.": ["Cria um efeito visual (VFX).", "Создаёт визуальный эффект (VFX)."], "Dosyandaki TAG’ler: ": ["TAGs no seu arquivo: ", "Теги в вашем файле: "], "Dosyandaki branch’ler: ": ["Branches no seu arquivo: ", "Ветки в вашем файле: "], "Alan anlamları bağlama göre değişebilir; düzenlemeden önce node özelliklerine bak.": ["O significado dos campos pode variar conforme o contexto; confira as propriedades do nó antes de editar.", "Значение полей может зависеть от контекста; перед правкой проверьте свойства узла."], "**Skill nasıl yapılır?**\n1. Rolünü seç: starter, kontrol, finisher ya da hareket.\n2. İskelet: ANIM → WAIT (startup) → HITBOX → WAIT (recovery).\n3. VELO, SFX ve VISUAL ile hissi güçlendir.\n4. TAG + STATE ile cooldown, sayaç ve koşulları ekle.\n5. BRANCH ile isabet/ıskalama veya combo devamını ayır.\n6. Skill Doktoru ile kontrol et, oyunda test et ve sayıları ince ayarla.": ["**Como criar uma skill**\n1. Escolha o papel: starter, controle, finisher ou movimento.\n2. Esqueleto: ANIM → WAIT (início) → HITBOX → WAIT (recuperação).\n3. Reforce a sensação com VELO, SFX e VISUAL.\n4. Use TAG + STATE para cooldowns, contadores e condições.\n5. Use BRANCH para separar acerto/erro ou a continuação do combo.\n6. Rode o Doutor de skills, teste no jogo e ajuste os números.", "**Как создать навык**\n1. Выберите роль: старт, контроль, финишер или движение.\n2. Каркас: ANIM → WAIT (старт) → HITBOX → WAIT (восстановление).\n3. Усильте ощущение через VELO, SFX и VISUAL.\n4. TAG + STATE — для перезарядок, счётчиков и условий.\n5. BRANCH — чтобы разделить попадание/промах или продолжение комбо.\n6. Запустите Доктор навыков, проверьте в игре и подправьте числа."], "**M1 combo mantığı**\nTipik yapı: her vuruş ANIM → HITBOX → WAIT. Adım sayacı TAG ile tutulur, BRANCH bir sonraki vuruşa geçirir, son vuruşta sayaç sıfırlanır. Pencere kaçarsa sayaç da sıfırlanmalı; yoksa combo takılı kalır. Son vuruşa daha yüksek STUN/knockback vermek yaygın bir tasarımdır.": ["**Lógica do combo M1**\nPadrão típico: cada golpe é ANIM → HITBOX → WAIT. Uma TAG guarda o contador de passos, o BRANCH avança para o próximo golpe e o último golpe zera o contador. Se a janela for perdida, o contador também deve zerar; senão o combo trava. Dar mais STUN/knockback ao último golpe é um design comum.", "**Логика комбо M1**\nТипичная схема: каждый удар — ANIM → HITBOX → WAIT. TAG хранит счётчик шагов, BRANCH переводит к следующему удару, последний удар сбрасывает счётчик. Если окно упущено, счётчик тоже нужно сбросить, иначе комбо зависнет. Усиленное оглушение/отбрасывание на последнем ударе — обычное решение."], "**Timing ve combo kuralı**\nStartup = vuruşa kadar geçen süre, recovery = vuruştan sonra serbest kalma süresi. Bir skill, rakibin STUN süresi bir sonraki skill’in startup’ından uzunsa combo’ya bağlanır. Düşük startup + kısa recovery güvenli ama düşük hasarlı olmalı; yüksek hasar uzun recovery ile dengelenmeli. Hit-confirm için devamı isabette BRANCH ile aç.": ["**Timing e regra de combo**\nStartup = tempo até o golpe; recovery = tempo até poder agir de novo. Uma skill se liga ao combo quando o STUN do alvo dura mais que o início da próxima skill. Início baixo + recuperação curta deve significar pouco dano; dano alto deve custar recuperação longa. Para hit-confirm, abra a continuação por um BRANCH no acerto.", "**Тайминг и правило комбо**\nStartup — время до удара, recovery — время до новых действий. Навык вписывается в комбо, если оглушение цели длится дольше старта следующего навыка. Быстрый старт и короткое восстановление должны давать малый урон; большой урон — стоить долгого восстановления. Для hit-confirm открывайте продолжение через BRANCH при попадании."], "Jujutsu Shenanigans, Jujutsu Kaisen’den esinlenen karakter movesetleri sunar (ör. Gojo, Sukuna, Itadori, Megumi, Nanami, Todo). Güncel kadroyu doğrulayamam; kesin liste için oyundaki seçim ekranına bak. Yüklediğin KLUv movesetini ise detaylı analiz edebilirim.": ["Jujutsu Shenanigans traz movesets inspirados em personagens de Jujutsu Kaisen (ex.: Gojo, Sukuna, Itadori, Megumi, Nanami, Todo). Não consigo verificar o elenco atual; veja a tela de seleção do jogo. Já o moveset KLUv que você carregar eu analiso em detalhes.", "В Jujutsu Shenanigans есть мувсеты по мотивам персонажей Jujutsu Kaisen (например, Годжо, Сукуна, Итадори, Мэгуми, Нанами, Тодо). Актуальный состав проверить не могу — смотрите экран выбора в игре. А загруженный мувсет KLUv я разберу подробно."], "**KLUv kodu**\nOyundaki moveset/character block ekranından Export ile alınan sıkıştırılmış veridir. Kodun tamamını, başındaki KLUv ile birlikte kopyalayıp kutuya yapıştır ve Aç’a bas. Açılmazsa kod eksik, kesilmiş veya farklı formatta olabilir.": ["**Código KLUv**\nÉ a exportação comprimida da tela de moveset/character block do jogo. Copie o código inteiro, com o prefixo KLUv, cole na caixa e toque em Abrir. Se falhar, o código pode estar incompleto, cortado ou em outro formato.", "**Код KLUv**\nСжатый экспорт с экрана мувсета/character block в игре. Скопируйте весь код вместе с префиксом KLUv, вставьте в поле и нажмите «Открыть». Если не открывается, код может быть неполным, обрезанным или в другом формате."], "Şunları deneyebilirsin: “Skill Doktoru”, “En iyi build”, “Skill nasıl yapılır?”, “Node sözlüğü”.": ["Experimente: “Doutor de skills”, “Melhor build”, “Como criar uma skill?”, “Glossário de nós”.", "Попробуйте: «Доктор навыков», «Лучший билд», «Как создать навык?», «Глоссарий узлов»."], "Moveset analizi": ["Analisar moveset", "Анализ мувсета"], "En iyi build": ["Melhor build", "Лучший билд"], "Skill nasıl yapılır?": ["Como criar uma skill?", "Как создать навык?"], "Node sözlüğü": ["Glossário de nós", "Глоссарий узлов"], "M1 combo mantığı": ["Lógica do M1", "Логика M1"], "Timing ve stun": ["Timing e stun", "Тайминг и оглушение"], "Karakterler": ["Personagens", "Персонажи"], "KLUv nasıl alınır?": ["Como obter o KLUv?", "Как получить KLUv?"], "Hiç HITBOX içermiyor; saldırıdan çok hareket, buff veya yardımcı skill gibi duruyor.": ["Não tem HITBOX; parece uma skill de movimento, buff ou utilidade, não de ataque.", "Нет HITBOX; больше похоже на навык движения, бафф или утилиту, чем на атаку."], "Çok hızlı açılıp yüksek hasar veriyor; riskli şekilde güçlü olabilir. Recovery süresi ekleyerek dengele.": ["Início muito rápido com dano alto; pode ser forte demais. Adicione recuperação para equilibrar.", "Очень быстрый старт и большой урон; возможно, слишком сильно. Добавьте восстановление для баланса."], "Hasarı düşük ama stun’ı yüksek: kontrol/combo bağlayıcı olarak iyi bir aday.": ["Pouco dano, mas stun alto: bom candidato a controle/extensor de combo.", "Малый урон, но большое оглушение: хороший кандидат в контроль/связку комбо."], "Hasar yüksek ama stun düşük; finisher olarak mantıklı, combo’ya bağlamak zor.": ["Dano alto, stun baixo: faz sentido como finisher, difícil de ligar em combos.", "Большой урон, малое оглушение: подходит как финишер, но трудно вписать в комбо."], "Rakamlar dengeli görünüyor. Yine de oyunda test etmeden kesin konuşamam.": ["Os números parecem equilibrados. Ainda assim, não posso afirmar sem testar no jogo.", "Цифры выглядят сбалансированно. Но без проверки в игре утверждать не могу."], "Yorumum": ["Minha opinião", "Моё мнение"], "Görsel inceleme için skill’i seçip Branch’ler veya TAG’ler sekmesine bak.": ["Para ver visualmente, selecione a skill e abra a aba Branches ou Tags.", "Чтобы посмотреть наглядно, выберите навык и откройте вкладку «Ветки» или «Теги»."], "Adım **JJS AI HELPER** 🙂 Jujutsu Shenanigans movesetleri ve skill build konusunda yardımcınım; sohbet de ederim.": ["Meu nome é **JJS AI HELPER** 🙂 Ajudo com movesets e builds de Jujutsu Shenanigans, e também converso.", "Меня зовут **JJS AI HELPER** 🙂 Помогаю с мувсетами и билдами Jujutsu Shenanigans, а ещё люблю поболтать."], "Moveset’e bakmak istersen söyle, yoksa sohbet de olur.": ["Se quiser revisar um moveset, é só falar — ou podemos apenas conversar.", "Если хотите разобрать мувсет — скажите; или можем просто поболтать."], "Harika! Hangi skill’e bakalım? Aşağıdaki isimlerden birine dokunabilirsin.": ["Ótimo! Qual skill vamos ver? Toque em um dos nomes abaixo.", "Отлично! Какой навык посмотрим? Нажмите на одно из имён ниже."], "nedir": ["o que é", "что это"], "Tüm alanlar için Node bilgisi sayfasında bu simgeye dokun.": ["Para todos os campos, toque neste ícone na página de Info de nós.", "Чтобы увидеть все поля, нажмите на этот значок на странице «Информация об узлах»."]});
