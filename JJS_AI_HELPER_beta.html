<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moveset Okuyucu · Skill Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1a1f;
      --surface: #24232a;
      --raised: #2d2c34;
      --fg: #e6e2d9;
      --muted: #a8a3b3;
      --accent: #e9a15f;
      --accent-strong: #f0b27a;
      --on-accent: #1b1a1f;
      --line: #3b3a45;
      --radius: 14px;
      --danger: #e8837a;
      --accent-soft: rgba(233, 161, 95, 0.14);
      --accent-line: rgba(233, 161, 95, 0.40);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --ring: 0 0 0 3px rgba(233, 161, 95, 0.30);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4efe6;
      --surface: #fbf8f2;
      --raised: #ece6da;
      --fg: #2f2b26;
      --muted: #6f675c;
      --accent: #b35a1f;
      --accent-strong: #944612;
      --on-accent: #fffaf3;
      --line: #d9d0c1;
      --danger: #b4443a;
      --accent-soft: rgba(179, 90, 31, 0.10);
      --accent-line: rgba(179, 90, 31, 0.38);
      --shadow: 0 10px 30px rgba(80, 60, 30, 0.14);
      --ring: 0 0 0 3px rgba(179, 90, 31, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
      min-height: 100%;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .app { max-width: 720px; margin: 0 auto; padding: 12px 12px 80px; }
    header { padding: 16px 4px 12px; }
    header .label {
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); font-family: ui-monospace, monospace; margin-bottom: 4px;
    }
    header h1 { font-size: 1.6rem; font-weight: 650; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .language-row { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--muted); font-size:12px; }
    .language-row select { background:var(--surface); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
    .paste-box {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 14px; margin-bottom: 16px;
    }
    .paste-box label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;
    }
    .paste-box textarea {
      width: 100%; min-height: 90px; resize: vertical;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 10px; outline: none;
    }
    .paste-box textarea:focus { border-color: var(--accent); }
    .paste-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center;
    }
    .btn {
      height: 40px; padding: 0 16px; border-radius: 8px;
      font-weight: 600; font-size: 0.9rem;
    }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-ghost { border: 1px solid var(--line); background: var(--raised); color: var(--fg); }
    .error-msg { color: var(--danger); font-size: 0.85rem; }
    .slot-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .slot-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface); text-align: left; min-height: 48px;
      transition: border-color .15s, background .15s;
    }
    .slot-btn.active { border-color: var(--accent); background: var(--raised); }
    .slot-btn .name { font-weight: 600; }
    .slot-btn .kind { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .detail {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 16px;
    }
    .detail-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .detail-head h2 { font-size: 1.4rem; font-weight: 650; }
    .detail-head .meta { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); }
    .detail-head .count { font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); text-align: right; }
    .node-list { display: flex; flex-direction: column; gap: 8px; list-style: none; }
    .node {
      border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
      overflow: hidden; list-style: none;
    }
    .node.is-branch { border-color: var(--accent-line); background: var(--raised); }
    .node-head {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      min-height: 44px; width: 100%; text-align: left;
    }
    .node-head .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; flex-shrink: 0; }
    .node.open .chev { transform: rotate(90deg); }
    .node-head .idx { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); width: 1.4em; }
    .node-head .kind { font-weight: 600; color: var(--accent); }
    .node.is-branch .kind { color: var(--accent-strong); }
    .node-head .branch-tag {
      background: var(--accent-soft); color: var(--accent);
      font-family: ui-monospace, monospace; font-size: 11px; padding: 2px 7px; border-radius: 6px;
    }
    .node-head .preview {
      font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
    }
    .node-head .kids-count { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .node-body { display: none; border-top: 1px solid var(--line); padding: 10px 12px 12px; }
    .node.open .node-body { display: block; }
    .props { display: grid; gap: 4px; font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 10px; }
    .props .row { display: grid; grid-template-columns: 9rem 1fr; gap: 8px; }
    .props .k { color: var(--muted); }
    .props .v { word-break: break-all; }
    .child-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; list-style: none; padding: 0; }
    .branches-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .branches-section h3 {
      font-size: 0.95rem; color: var(--muted); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .branch-block {
      border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
      padding: 12px; margin-bottom: 12px;
    }
    .branch-block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .branch-block-head .title { font-family: ui-monospace, monospace; font-weight: 600; color: var(--accent); font-size: 13px; }
    .empty-msg { font-size: 12px; color: var(--muted); font-style: italic; }
    .tip { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    @media (min-width: 700px) {
      .layout { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
      .slot-list { margin-bottom: 0; position: sticky; top: 12px; }
    }
  
    /* AI Assistant */
    .ai-toggle {
      position: fixed; bottom: 20px; right: 20px; z-index: 1000;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: var(--on-accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
      font-size: 24px; transition: transform .2s;
    }
    .ai-toggle:hover { transform: scale(1.08); }
    .ai-panel {
      position: fixed; bottom: 90px; right: 16px; z-index: 999;
      width: min(380px, calc(100vw - 32px)); height: min(520px, 70vh);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; display: none; flex-direction: column;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .ai-panel.open { display: flex; }
    .ai-header {
      padding: 12px 16px; background: var(--raised);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .ai-header h3 { font-size: 0.95rem; font-weight: 650; }
    .ai-header .sub { font-size: 11px; color: var(--muted); }
    .ai-messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .ai-msg {
      max-width: 92%; padding: 10px 12px; border-radius: 12px;
      font-size: 0.88rem; line-height: 1.45;
    }
    .ai-msg.bot {
      background: var(--bg); border: 1px solid var(--line);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .ai-msg.user {
      background: var(--accent-soft); border: 1px solid var(--accent-line);
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .ai-msg strong { color: var(--accent); }
    .ai-input-row {
      padding: 10px; border-top: 1px solid var(--line);
      display: flex; gap: 8px;
    }
    .ai-input-row input {
      flex: 1; height: 40px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg);
      color: var(--fg); padding: 0 12px; font-size: 0.9rem; outline: none;
    }
    .ai-input-row input:focus { border-color: var(--accent); }
    .ai-input-row button {
      height: 40px; padding: 0 14px; border-radius: 10px;
      background: var(--accent); color: var(--on-accent); font-weight: 600;
    }
    .ai-quick {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px;
    }
    .ai-quick button {
      font-size: 11px; padding: 5px 10px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    }
    .ai-quick button:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- Göz yormayan tema: konfor katmanı ---- */
    html { -webkit-text-size-adjust: 100%; }
    body { font-size: 16px; line-height: 1.6; letter-spacing: 0.005em; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
    .app { padding: 16px 14px 96px; }
    header { padding: 20px 4px 16px; }
    header h1 { font-size: 1.75rem; letter-spacing: -0.01em; }
    header p { font-size: 0.95rem; }
    header .label { font-size: 12px; }
    .language-row { flex-wrap: wrap; font-size: 13px; }
    .language-row select, .theme-toggle {
      min-height: 40px; border-radius: 10px; padding: 8px 12px;
      background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    }
    .theme-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; transition: border-color .15s, background .15s; }
    .theme-toggle:hover { border-color: var(--accent); }
    .paste-box, .detail { box-shadow: var(--shadow); }
    .paste-box { padding: 16px; }
    .paste-box textarea { font-size: 13px; line-height: 1.5; padding: 12px; min-height: 100px; background: var(--bg); }
    .btn { height: 44px; padding: 0 20px; border-radius: 10px; transition: background .15s, transform .1s, border-color .15s; }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn:active, .slot-btn:active { transform: scale(0.98); }
    .slot-btn { min-height: 52px; border-radius: 12px; }
    .slot-btn:hover { border-color: var(--accent-line); background: var(--raised); }
    .slot-btn.active { background: var(--accent-soft); border-color: var(--accent); }
    .slot-btn.active .name { color: var(--accent-strong); }
    .node { border-radius: 12px; }
    .node-head { min-height: 48px; padding: 10px 14px; transition: background .15s; }
    .node-head:hover { background: var(--accent-soft); }
    .node-head .preview, .node-head .kids-count, .node-head .idx, .props { font-size: 12px; }
    .node.is-branch { border-color: var(--accent-line); background: var(--accent-soft); }
    .ai-toggle { color: var(--on-accent); }
    .ai-msg { font-size: 0.92rem; }
    .ai-msg.user { color: var(--fg); }
    .ai-header { background: var(--raised); }
    .ai-quick button { font-size: 12px; padding: 7px 12px; }
    .ai-input-row input, .ai-input-row button { height: 44px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea:focus, input:focus { box-shadow: var(--ring); }
    ::selection { background: var(--accent-line); color: var(--fg); }
    * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    .ai-quick { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 10px; }
    .ai-quick button { white-space: nowrap; flex-shrink: 0; }
    .ai-panel { height: min(600px, 78vh); }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0; padding: 4px 0; position: sticky; top: 0; z-index: 5; background: var(--surface); }
    .tab { flex-shrink: 0; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .15s, color .15s, border-color .15s; }
    .tab:hover { color: var(--fg); border-color: var(--accent-line); }
    .tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .tab .badge { display: inline-block; min-width: 20px; margin-left: 4px; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: rgba(0,0,0,0.18); }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .stat b { font-size: 1.25rem; color: var(--accent-strong); font-weight: 650; }
    .stat span { font-size: 12px; color: var(--muted); }
    .note { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
    .note.warn { border-color: var(--accent-line); background: var(--accent-soft); }
    .note.ok { border-color: #6aa97f; }
    .howto { font-size: 13px; color: var(--muted); line-height: 1.65; margin: 4px 0 14px; }
    .howto b { color: var(--fg); }
    .muted { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .tab-search { width: 100%; min-height: 44px; margin-bottom: 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 15px; font-family: inherit; }
    details.branch-block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: var(--raised); overflow: hidden; }
    details.branch-block > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; min-height: 48px; }
    details.branch-block > summary::-webkit-details-marker { display: none; }
    details.branch-block[open] > summary { border-bottom: 1px solid var(--line); }
    details.branch-block .title { font-weight: 650; color: var(--accent-strong); font-family: ui-monospace, monospace; }
    details.branch-block .node-list { padding: 10px; }
    .refs { font-size: 12px; color: var(--muted); padding: 8px 14px 0; }
    .tag-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); }
    .tag-name { font-family: ui-monospace, monospace; font-weight: 650; color: var(--accent-strong); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips i { font-style: normal; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--fg); }

    [hidden] { display: none !important; }
    .viewnav { display: flex; gap: 8px; margin: 4px 0 14px; }
    .vbtn { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 650; cursor: pointer; font-family: inherit; transition: background .15s, color .15s, border-color .15s; }
    .vbtn:hover { border-color: var(--accent-line); color: var(--fg); }
    .vbtn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .ngrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 640px) { .ngrid { grid-template-columns: repeat(3, 1fr); } }
    .ncard { position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; min-height: 124px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: transform .12s, border-color .15s, background .15s; }
    .ncard:hover { border-color: var(--accent); background: var(--raised); }
    .ncard:active { transform: scale(0.98); }
    .ncard b { font-family: ui-monospace, monospace; color: var(--accent-strong); font-size: 15px; }
    .ncard .ns { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .nic { font-size: 26px; line-height: 1; }
    .nic.big { font-size: 40px; }
    .nbadge { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); }
    .nbar { position: sticky; top: 0; z-index: 6; padding: 8px 0; background: var(--bg); }
    .nhead { display: flex; align-items: center; gap: 14px; margin: 6px 0 16px; }
    .nhead h2 { font-family: ui-monospace, monospace; color: var(--accent-strong); font-size: 1.4rem; }
    .nhead .muted { margin: 4px 0 0; font-size: 14px; }
    .nsec { padding: 12px 14px; font-size: 14.5px; line-height: 1.65; }
    .nsec ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
    .ntable-wrap { overflow-x: auto; }
    .ntable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 460px; }
    .ntable th, .ntable td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .ntable th { color: var(--muted); font-weight: 600; }
    .ntable code { color: var(--accent-strong); font-size: 12px; }
    .nex { white-space: pre-wrap; font-size: 13px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
    .nrel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
    .nback2 { width: 100%; margin-top: 14px; }
    .nn { font-size: 12px; color: var(--muted); }
    .ncard .nn { margin-bottom: 2px; }
    .nhead .nn { margin: 2px 0 0; }
    .dash-btn { position: sticky; top: 8px; z-index: 30; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; margin: 0 0 8px; border-radius: 12px; border: 1px solid var(--accent-line); background: var(--surface); color: var(--fg); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: background .15s, border-color .15s; }
    .dash-btn:hover { border-color: var(--accent); background: var(--raised); }
    .dash-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.45); }
    .dash-drawer { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; width: min(82vw, 300px); background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(-102%); transition: transform .22s ease; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
    .dash-drawer.open { transform: none; }
    .dash-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 10px; border-bottom: 1px solid var(--line); font-size: 16px; }
    .dash-x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); cursor: pointer; font-size: 16px; }
    #dashNav { display: flex; flex-direction: column; gap: 8px; }
    .dash-item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: left; position: relative; transition: background .15s, border-color .15s; }
    .dash-item:hover { border-color: var(--accent-line); }
    .dash-item.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .dash-item .nic { font-size: 20px; }
    .dash-item .nbadge { top: 50%; right: 12px; transform: translateY(-50%); }
    .nbadge.on { background: var(--accent); color: var(--on-accent); }
    .mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
    .mnow { display: flex; align-items: center; gap: 14px; }
    .mnow .muted { margin: 2px 0 0; }
    .mvol { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .mvol input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
    .mh { font-size: 14px; color: var(--muted); font-weight: 650; margin: 18px 0 10px; }

<script>
  (function(){
    var KEY='jjs-theme', t=null;
    try{ t=localStorage.getItem(KEY); }catch(e){}
    if(t!=='light'&&t!=='dark'){ t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'; }
    document.documentElement.setAttribute('data-theme',t);
    window.addEventListener('DOMContentLoaded',function(){
      var btn=document.getElementById('themeToggle'),ic=document.getElementById('themeIcon'),tx=document.getElementById('themeText');
      var L={
        tr:['Açık tema','Koyu tema','Tema'],
        en:['Light theme','Dark theme','Theme'],
        es:['Tema claro','Tema oscuro','Tema'],
        pt:['Tema claro','Tema escuro','Tema'],
        ru:['Светлая тема','Тёмная тема','Тема']
      };
      function lang(){ var l='tr'; try{ l=localStorage.getItem('jjs-language')||'tr'; }catch(e){} return L[l]?l:'tr'; }
      function paint(){
        var l=document.documentElement.getAttribute('data-theme')==='light', s=L[lang()];
        ic.textContent=l?'☾':'☀'; tx.textContent=l?s[1]:s[0]; btn.setAttribute('aria-label',s[2]);
        var m=document.querySelector('meta[name=theme-color]'); if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m);}
        m.content=l?'#f4efe6':'#1b1a1f';
      }
      var sel=document.getElementById('languageSelect');
      if(sel) sel.addEventListener('change',function(){ setTimeout(paint,0); });
      paint();
      btn.addEventListener('click',function(){
        var n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
        document.documentElement.setAttribute('data-theme',n);
        try{localStorage.setItem(KEY,n);}catch(e){}
        paint();
      });
    });
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js"></script>
  <script>
    const SHOW = new Set([
      "EFFECT","TAG","NAME","TIME","VALUE","STATE","SPEED","SIZE","POSITION","ID",
      "VOLUME","CHECK","AMOUNT","COLOR","BODY PART","ADD/REMOVE","SET","BRANCH",
      "START","END","FADE IN","FADE OUT","LOOPED","ANIM_USE","TEXTURE","OPACITY",
      "ROTATION","LAST HIT","CANCEL","CANCEL ON END","CANCEL ON INTERRUPT",
      "CLIENT SIDED","RUN ON SERVER","GLOBAL","DISABLE BURST","RELATIVE FROM BRANCH",
      "CAN COLLIDE","EASING DIRECTION","EASING STYLE"
    ]);

    let SLOTS = [];
    let DEFAULT_SLOTS = [];
    var CUR = 0, TAB = "summary";

    function parseData(value) {
      if (typeof value === "string") {
        try { return JSON.parse(value); } catch { return undefined; }
      }
      if (value && typeof value === "object") return value;
      return undefined;
    }

    function normalize(raw) {
      if (!Array.isArray(raw)) throw new Error("Moveset bir liste değil.");
      return raw.map(item => {
        if (!item || typeof item !== "object") throw new Error("Slot bozuk.");
        return { ...item, DATA: parseData(item.DATA) };
      });
    }

    function decodeExport(code) {
      const trimmed = code.replace(/\s+/g, "");
      if (!trimmed.startsWith("KLUv")) {
        throw new Error("Kod KLUv ile başlamalı.");
      }
      const binary = Uint8Array.from(atob(trimmed), c => c.charCodeAt(0));
      let text;
      try {
        const decompressed = fzstd.decompress(binary);
        text = new TextDecoder().decode(decompressed);
      } catch (e) {
        throw new Error("Sıkıştırma yarım veya bozuk. Kodun tamamını yapıştır.");
      }
      return normalize(JSON.parse(text));
    }

    function formatValue(v) {
      if (typeof v === "boolean") return v ? "true" : "false";
      if (Array.isArray(v)) return "[" + v.length + " öğe]";
      if (v && typeof v === "object") return "{…}";
      return String(v);
    }

    function childNodes(node) {
      const out = [];
      for (const value of Object.values(node)) {
        if (Array.isArray(value)) {
          for (const item of value) {
            if (item && typeof item === "object" && "K_NAME" in item) out.push(item);
          }
        }
      }
      return out;
    }

    function renderNode(node, index, branches, depth) {
      depth = depth || 0;
      const kind = String(node.K_NAME ?? "?");
      const isBranch = kind === "BRANCH";
      let branchKey = null;
      let resolvedKids = [];

      if (isBranch) {
        branchKey = node.BRANCH ?? node.VALUE ?? node.NAME ?? null;
        if (branchKey && branches[branchKey]) {
          resolvedKids = branches[branchKey].Line || [];
        }
      }

      const inlineKids = childNodes(node);
      const kids = resolvedKids.length > 0 ? resolvedKids : inlineKids;

      const props = Object.entries(node).filter(function(pair) {
        var k = pair[0], v = pair[1];
        return SHOW.has(k) && v !== "" && v != null && k !== "K_NAME" && !(isBranch && k === "BRANCH");
      });

      const hasContent = kids.length > 0 || props.length > 0;
      const autoOpen = depth < 1;

      const el = document.createElement("li");
      el.className = "node" + (isBranch ? " is-branch" : "") + (autoOpen && hasContent ? " open" : "");

      const head = document.createElement("button");
      head.type = "button";
      head.className = "node-head";
      var previewText = props.slice(0,3).map(function(p){ return p[0] + " " + formatValue(p[1]); }).join(" · ");
      head.innerHTML =
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>' +
        '<span class="idx">' + (index + 1) + '</span>' +
        '<span class="kind">' + dn(kind) + '</span>' +
        (isBranch && branchKey ? '<span class="branch-tag">→ ' + branchKey + '</span>' : '') +
        '<span class="preview">' + previewText + '</span>' +
        (kids.length ? '<span class="kids-count">' + kids.length + ' alt</span>' : '');

      if (hasContent) {
        head.onclick = function() { el.classList.toggle("open"); };
      } else {
        head.style.cursor = "default";
        head.querySelector(".chev").style.opacity = "0.2";
      }
      el.appendChild(head);

      if (hasContent) {
        const body = document.createElement("div");
        body.className = "node-body";

        if (props.length) {
          const dl = document.createElement("div");
          dl.className = "props";
          props.forEach(function(pair) {
            var row = document.createElement("div");
            row.className = "row";
            row.innerHTML = '<span class="k">' + pair[0] + '</span><span class="v">' + formatValue(pair[1]) + '</span>';
            dl.appendChild(row);
          });
          body.appendChild(dl);
        }

        if (kids.length) {
          const ol = document.createElement("ol");
          ol.className = "child-list";
          kids.forEach(function(child, i) {
            ol.appendChild(renderNode(child, i, branches, depth + 1));
          });
          body.appendChild(ol);
        }

        if (isBranch && branchKey && resolvedKids.length === 0) {
          const msg = document.createElement("p");
          msg.className = "empty-msg";
          msg.textContent = 'Branch "' + branchKey + '" bulunamadı veya boş.';
          body.appendChild(msg);
        }

        el.appendChild(body);
      }

      return el;
    }

    function escH(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function renderDetail(slot) {
      const root = document.getElementById("detail");
      root.innerHTML = "";
      if (!slot || typeof H === "undefined" || !H) return;
      const line = (slot.DATA && slot.DATA.Line) || [];
      const branches = (slot.DATA && slot.DATA.Branch) || {};
      const bkeys = Object.keys(branches), tip = slot["TOOL TIP"];
      var st = slotStats(slot), iss = [], flat = slotNodes(slot);
      try { iss = lint(slot); } catch (e) {}
      var others = flat.filter(function(n){ return n.K_NAME !== "TAG" && n.K_NAME !== "BRANCH"; });
      const article = document.createElement("article");
      article.className = "detail";
      var meta = (slot.K_NAME || "") + (slot.KEY != null ? " · key " + slot.KEY : "") + (slot.COOLDOWN != null ? " · cd " + slot.COOLDOWN : "");
      article.innerHTML = '<div class="detail-head"><div><h2>' + escH(slot.NAME || "(isimsiz)") + '</h2><p class="meta">' + escH(meta) + '</p></div><div class="count">' + line.length + ' node<br><span style="color:var(--muted);font-size:12px">' + bkeys.length + ' branch</span></div></div>';
      if (tip) { var p = document.createElement("p"); p.className = "tip"; p.textContent = tip; article.appendChild(p); }

      function nodeList(arr, depth) {
        var ol = document.createElement("ol"); ol.className = "node-list";
        arr.forEach(function(n, i){ ol.appendChild(renderNode(n, i, branches, depth)); });
        return ol;
      }
      function box(html){ var d = document.createElement("div"); d.innerHTML = html; return d; }
      var tagCount = Object.keys(st.tags).length;
      var B = {
        summary: function() {
          var cards = [[Lx(H.startup), st.startup === null ? "?" : st.startup.toFixed(2) + "s"], ["HITBOX", st.hits], [t("damage"), st.dmg.toFixed(1)], [t("stun"), st.stun.toFixed(2)], ["Branch", bkeys.length], ["TAG", tagCount], ["ANIM", st.anims], [t("wait"), st.wait.toFixed(1) + "s"]];
          var d = box('<div class="stat-grid">' + cards.map(function(c){ return '<div class="stat"><b>' + escH(c[1]) + '</b><span>' + escH(c[0]) + '</span></div>'; }).join("") + '</div>' +
            '<div class="note"><strong>' + Lx(X("Rol tahmini", "Likely role", "Rol probable")) + ':</strong> ' + escH(role(st)) + '</div>' +
            '<div class="note ' + (iss.length ? "warn" : "ok") + '"><strong>' + Lx(X("Skill Doktoru", "Skill Doctor", "Doctor de skills")) + '</strong><br>' + (iss.length ? iss.slice(0, 8).map(function(x){ return "⚠ " + escH(x); }).join("<br>") : "✔ " + escH(Lx(H.clean))) + '</div>' +
            '<div class="howto">' + Lx(X("<b>Nasıl okunur?</b> <b>Akış</b> skill’in ana sırasıdır. <b>Branch’ler</b> koşula göre açılan yan yollardır. <b>TAG’ler</b> koşul ve sayaçlardır. <b>Diğer</b> hitbox, animasyon, hız gibi detayları türüne göre toplar.", "<b>How to read:</b> <b>Flow</b> is the main sequence. <b>Branches</b> are side paths triggered by conditions. <b>Tags</b> are conditions and counters. <b>Other</b> groups hitboxes, animations, velocity and more by type.", "<b>Cómo leer:</b> <b>Flujo</b> es la secuencia principal. <b>Branches</b> son rutas por condición. <b>Tags</b> son condiciones y contadores. <b>Otros</b> agrupa hitboxes, animaciones y más por tipo.")) + '</div>');
          var b = document.createElement("button"); b.type = "button"; b.className = "btn btn-ghost"; b.textContent = "🤖 " + Lx(X("Asistana sor", "Ask the assistant", "Preguntar al asistente"));
          b.onclick = function(){ document.getElementById("aiPanel").classList.add("open"); aiAsk(slot.NAME); };
          d.appendChild(b); return d;
        },
        flow: function() { return nodeList(line, 0); },
        branch: function() {
          var w = document.createElement("div");
          if (!bkeys.length) { w.innerHTML = '<p class="muted">' + escH(Lx(X("Bu skill’de branch yok.", "This skill has no branches.", "Esta skill no tiene branches."))) + '</p>'; return w; }
          var inp = document.createElement("input"); inp.type = "search"; inp.className = "tab-search"; inp.placeholder = Lx(X("Branch ara…", "Search branch…", "Buscar branch…"));
          var list = document.createElement("div"), refsBy = {};
          flat.forEach(function(n){ var k = n.K_NAME === "BRANCH" ? (n.BRANCH || n.VALUE || n.NAME) : n.BRANCH; if (typeof k === "string" && k && k !== "nil") (refsBy[k] = refsBy[k] || []).push(n.K_NAME + (n.TAG ? " " + n.TAG : "")); });
          bkeys.forEach(function(key) {
            var bl = (branches[key] && branches[key].Line) || [], det = document.createElement("details");
            det.className = "branch-block"; det.dataset.key = key.toLowerCase();
            det.innerHTML = '<summary class="branch-block-head"><span class="title">⎇ ' + escH(key) + '</span><span class="muted">' + bl.length + ' node' + (refsBy[key] ? "" : " · " + Lx(X("kullanılmıyor", "unused", "sin usar"))) + '</span></summary>' + (refsBy[key] ? '<p class="refs">' + Lx(X("Çağıran: ", "Called by: ", "Llamado por: ")) + escH(refsBy[key].slice(0, 8).join(", ")) + '</p>' : "");
            var ol = document.createElement("ol"); ol.className = "node-list";
            bl.forEach(function(n, i){ ol.appendChild(renderNode(n, i, branches, 1)); });
            det.appendChild(ol); list.appendChild(det);
          });
          inp.oninput = function(){ var v = inp.value.toLowerCase(); [].forEach.call(list.children, function(c){ c.style.display = c.dataset.key.indexOf(v) > -1 ? "" : "none"; }); };
          w.appendChild(inp); w.appendChild(list); return w;
        },
        tag: function() {
          var g = {};
          flat.forEach(function(n){ if (n.K_NAME !== "TAG" || n.TAG == null) return; var r = g[n.TAG] = g[n.TAG] || {c: 0, br: {}, chk: 0, set: 0, val: {}}; r.c++; if (n.BRANCH && n.BRANCH !== "nil") r.br[n.BRANCH] = 1; if (n.CHECK) r.chk++; if (n.SET) r.set++; if (n.VALUE != null && n.VALUE !== "") r.val[n.VALUE] = 1; });
          var ks = Object.keys(g), w = document.createElement("div");
          w.innerHTML = '<p class="muted">' + escH(Lx(X("TAG: koşul veya sayaç işaretçisi. “Kontrol” değeri okur, “Yazar” değer atar.", "TAG: a condition/counter marker. “Check” reads a value, “Sets” writes one.", "TAG: marcador de condición/contador. “Lee” comprueba un valor, “Escribe” lo asigna."))) + '</p>' + (ks.length ? ks.map(function(k){ var r = g[k]; return '<div class="tag-row"><span class="tag-name">' + escH(k) + '</span><span class="chips">' + (r.chk ? '<i>' + Lx(X("Kontrol", "Check", "Lee")) + ' ×' + r.chk + '</i>' : "") + (r.set ? '<i>' + Lx(X("Yazar", "Sets", "Escribe")) + ' ×' + r.set + '</i>' : "") + (Object.keys(r.val).length ? '<i>= ' + escH(Object.keys(r.val).slice(0, 4).join(", ")) + '</i>' : "") + (Object.keys(r.br).length ? '<i>⎇ ' + escH(Object.keys(r.br).join(", ")) + '</i>' : "") + '</span></div>'; }).join("") : '<p class="muted">—</p>');
          return w;
        },
        other: function() {
          var w = document.createElement("div"), by = {};
          others.forEach(function(n){ (by[n.K_NAME] = by[n.K_NAME] || []).push(n); });
          var order = ["HITBOX", "ANIM", "VELO", "STATE", "VISUAL", "SFX", "WAIT"], ks = Object.keys(by).sort(function(a, b){ var x = order.indexOf(a), y = order.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
          if (!ks.length) w.innerHTML = '<p class="muted">—</p>';
          ks.forEach(function(k, i){
            var det = document.createElement("details"); det.className = "branch-block"; if (i === 0) det.open = true;
            det.innerHTML = '<summary class="branch-block-head"><span class="title">' + escH(dn(k)) + '</span><span class="muted">' + by[k].length + '</span></summary>';
            det.appendChild(nodeList(by[k], 1)); w.appendChild(det);
          });
          return w;
        }
      };
      var tabs = [["summary", X("Özet", "Summary", "Resumen"), ""], ["flow", X("Akış", "Flow", "Flujo"), line.length], ["branch", X("Branch’ler", "Branches", "Branches"), bkeys.length], ["tag", X("TAG’ler", "Tags", "Tags"), tagCount], ["other", X("Diğer", "Other", "Otros"), others.length]];
      var bar = document.createElement("div"); bar.className = "tabs"; bar.setAttribute("role", "tablist");
      var body = document.createElement("div"); body.className = "tab-body";
      function show(id) {
        TAB = id;
        [].forEach.call(bar.children, function(b){ b.classList.toggle("active", b.dataset.id === id); b.setAttribute("aria-selected", b.dataset.id === id); });
        body.innerHTML = ""; body.appendChild(B[id]());
      }
      tabs.forEach(function(tb){
        var b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.dataset.id = tb[0]; b.setAttribute("role", "tab");
        b.innerHTML = escH(Lx(tb[1])) + (tb[2] !== "" ? ' <span class="badge">' + tb[2] + '</span>' : "");
        b.onclick = function(){ show(tb[0]); };
        bar.appendChild(b);
      });
      article.appendChild(bar); article.appendChild(body);
      root.appendChild(article);
      show(B[TAB] ? TAB : "summary");
    }

    function renderList(activeIndex) {
      CUR = activeIndex;
      const nav = document.getElementById("slotList");
      nav.innerHTML = "";
      SLOTS.forEach(function(item, index) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "slot-btn" + (index === activeIndex ? " active" : "");
        btn.innerHTML =
          '<span class="name">' + (item.NAME || "(isimsiz)") + '</span>' +
          '<span class="kind">' + (item.K_NAME || "") + '</span>';
        btn.onclick = function() {
          renderList(index);
          renderDetail(SLOTS[index]);
        };
        nav.appendChild(btn);
      });
    }

    function loadSlots(slots, sourceLabel) {
      SLOTS = slots;
      document.getElementById("status").textContent =
        sourceLabel + " · " + slots.length + (LANG === "en" ? " slots · branches parsed" : LANG === "es" ? " espacios · branches cargados" : LANG === "pt" ? " slots · branches carregados" : LANG === "ru" ? " слотов · ветки загружены" : " slot · Branch'ler düzgün gösteriliyor");
      document.getElementById("errorMsg").textContent = "";
      renderList(0);
      renderDetail(slots[0] || null);

        return '**'+t('build')+'**\n'+ranked.map(function(x,i){return (i+1)+'. '+x.s.NAME+' — '+x.score+' (hitbox/branch ağırlıklı)';}).join('\n')+'\n\n'+(LANG==='tr'?'Bunlar dosyandaki node yoğunluğuna göre adaylardır; gerçek combo uyumu için startup, recovery, stun süresi ve hit confirm sırası ayrıca test edilmeli.':'These are candidates ranked by node structure, not proven combo routes. Test startup, recovery, stun duration, and hit-confirm order in-game.')+'\n'+t('safety');
      }
      if(/(hitbox|damage|hasar|stun|sersem)/i.test(q))return SLOTS&&SLOTS.length?analyzeCurrentMoveset():t('noData');
      if(/(skill builder|node|tag|hitbox|anim|velo|state|sfx)/i.test(q))return 'TAG = condition marker; BRANCH = route to a branch key; HITBOX = attack detection and hit properties; ANIM = animation; SFX = sound; STATE = temporary character state; VELO = movement/knockback; WAIT = delay; VISUAL = effect. Exact field meanings can vary by node context—inspect the node properties before editing.';
      if(/(kluv|export|import|kod)/i.test(q))return LANG==='tr'?'KLUv kodu, oyundaki moveset/character block arayüzünden Export ile alınan sıkıştırılmış veridir. Kodun tamamını kopyala; başındaki KLUv kısmını koru ve buradaki alana yapıştır. Açılmazsa kod eksik, bozulmuş veya farklı formatta olabilir.':'KLUv is the compressed moveset export. Copy the entire code, keep the KLUv prefix, and paste it here. If it fails, the code may be incomplete or use a different format.';
      for(var i=0;i<(SLOTS||[]).length;i++){var name=(SLOTS[i].NAME||'').toLowerCase();if(name&&q.includes(name))return skillReport(SLOTS[i]);}
      if(/(selam|merhaba|hello|hi|hola|olá|привет)/i.test(q))return t('intro');
      return t('unknown');
    }
    function aiAddMsg(message,who){var box=document.getElementById('aiMessages'),div=document.createElement('div');div.className='ai-msg '+who;var safe=String(message).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');safe=safe.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');div.innerHTML=safe;box.appendChild(div);box.scrollTop=box.scrollHeight;}
    function aiAsk(q){if(!q.trim())return;aiAddMsg(q,'user');setTimeout(function(){aiAddMsg(aiAnswer(q),'bot');},120);}
    document.getElementById('aiToggle').onclick=function(){document.getElementById('aiPanel').classList.toggle('open');};

    document.querySelectorAll('#aiQuick button').forEach(function(btn,i){btn.onclick=function(){var queries={tr:['Moveset analizi','Bu skill nasıl çalışıyor?','Combo build öner','Hitbox ve stun analizi','Branch sistemi'],en:['Analyze moveset','How does this skill work?','Suggest a combo build','Analyze hitbox and stun','Branch system'],es:['Analizar moveset','¿Cómo funciona esta skill?','Sugerir combo','Analizar hitbox y stun','Sistema de branches'],pt:['Analisar moveset','Como esta skill funciona?','Sugerir combo','Analisar hitbox e stun','Sistema de branches'],ru:['Анализ moveset','Как работает навык?','Предложить комбо','Анализ hitbox и stun','Система веток']};aiAsk((queries[LANG]||queries.tr)[i]);};});
    // ===== JJS Skill Builder Assistant v2 (offline, veri tabanlı) =====
    function X(tr,en,es){return {tr:tr,en:en,es:es};}
    function Lx(o){return o[LANG]||((LANG==="pt"||LANG==="ru")&&typeof PTRU!=="undefined"&&PTRU[o.tr]&&PTRU[o.tr][LANG==="pt"?0:1])||o.en;}
    function nm(v){var n=Number(v);return isFinite(n)?n:0;}
    function slotNodes(s){var d=s.DATA||{},br=d.Branch||{},all=walkNodes((d.Line||[]).slice(),[]);Object.keys(br).forEach(function(k){walkNodes(((br[k]||{}).Line||[]).slice(),all);});return all;}
    function slotStats(s){
      var d=s.DATA||{},ns=slotNodes(s),st={hits:0,dmg:0,stun:0,wait:0,startup:null,anims:0,tags:{},refs:{},br:Object.keys(d.Branch||{})},acc=0;
      (d.Line||[]).forEach(function(n){if(n.K_NAME==='WAIT')acc+=nm(n.TIME);if(n.K_NAME==='HITBOX'&&st.startup===null)st.startup=acc;});
      ns.forEach(function(n){
        if(n.K_NAME==='HITBOX'){st.hits++;st.dmg+=nm(n.DAMAGE);st.stun=Math.max(st.stun,nm(n.STUN));}
        if(n.K_NAME==='WAIT')st.wait+=nm(n.TIME);
        if(n.K_NAME==='ANIM')st.anims++;
        if(n.K_NAME==='TAG'&&n.TAG)st.tags[n.TAG]=(st.tags[n.TAG]||0)+1;
        var k=n.K_NAME==='BRANCH'?(n.BRANCH||n.VALUE||n.NAME):n.BRANCH;

      });

    }
    var H={

      unused:X('Kullanılmayan branch: ','Unused branch: ','Branch sin usar: '),

      longw:X('Çok uzun WAIT: ','Very long WAIT: ','WAIT muy largo: '),

      startup:X('Açılış (startup)','Startup','Inicio'),

    function lint(s){
      var st=slotStats(s),br=(s.DATA||{}).Branch||{},out=[];
      Object.keys(st.refs).forEach(function(k){if(!br[k])out.push(Lx(H.missing)+k);});
      st.br.forEach(function(k){if(!st.refs[k])out.push(Lx(H.unused)+k);});
      slotNodes(s).forEach(function(n){if(n.K_NAME==='HITBOX'&&nm(n.DAMAGE)<=0)out.push(Lx(H.zero));if(n.K_NAME==='WAIT'&&nm(n.TIME)>5)out.push(Lx(H.longw)+nm(n.TIME)+'s');});
      if(s.K_NAME==='SKILL'&&!st.hits)out.push(Lx(H.nohit));

    }
    function role(st){var r=[];if(st.startup!==null&&st.startup<=0.3)r.push(Lx(X('hızlı starter','fast starter','starter rápido')));if(st.stun>=1)r.push(Lx(X('kontrol/stun','control/stun','control/stun')));if(st.dmg>=15)r.push(Lx(X('finisher/yüksek hasar','finisher/high damage','finisher/alto daño')));return r.join(', ')||'—';}
    function deep(s){

    }
    function doctor(){
      if(!SLOTS||!SLOTS.length)return t('noData');

      return '**'+Lx(X('Skill Doktoru','Skill Doctor','Doctor de skills'))+'**\n'+(out.length?out.slice(0,14).join('\n')+(out.length>14?'\n… +'+(out.length-14):''):'✔ '+Lx(H.clean));

    function rank(){

      var fast=rows.slice().sort(function(a,b){return (a.st.startup||0)-(b.st.startup||0);}).slice(0,3),big=rows.slice().sort(function(a,b){return b.st.dmg-a.st.dmg;}).slice(0,3),ctl=rows.slice().sort(function(a,b){return b.st.stun-a.st.stun;}).slice(0,3);

      return '**'+Lx(X('Build önerisi','Build suggestion','Sugerencia de build'))+'**\n'+Lx(X('Starter adayları (en hızlı açılış):','Starter picks (fastest startup):','Starters (inicio más rápido):'))+'\n'+f(fast,function(x){return (x.startup||0).toFixed(2)+'s';})+'\n\n'+Lx(X('Kontrol / combo bağlayıcı (en yüksek stun):','Control / combo extenders (highest stun):','Control / extensores (más stun):'))+'\n'+f(ctl,function(x){return x.stun.toFixed(2);})+'\n\n'+Lx(X('Finisher adayları (en yüksek hasar):','Finisher picks (highest damage):','Finishers (más daño):'))+'\n'+f(big,function(x){return x.dmg.toFixed(1);})+'\n\n'+Lx(X('Önerilen zincir: starter → kontrol → finisher. Stun süresi, sıradaki skill’in açılışından uzun olmalı.','Suggested chain: starter → control → finisher. Stun should outlast the next skill’s startup.','Cadena sugerida: starter → control → finisher. El stun debe superar el inicio de la siguiente skill.'))+'\n'+t('safety');
    }
    var GL={
      TAG:X('Koşul/sayaç işaretçisi. CHECK etiketin değerine bakar ve uygunsa BRANCH yoluna gider; SET değer yazar. Counter, cooldown ve combo adımı takibi için kullanılır.','Condition/counter marker. CHECK reads a tag and routes to its BRANCH; SET writes a value. Used for counters, cooldowns and combo-step tracking.','Marcador de condición/contador. CHECK lee la etiqueta y va al BRANCH; SET escribe un valor. Útil para contadores, cooldowns y pasos de combo.'),

      HITBOX:X('Saldırı alanı. DAMAGE, STUN, boyut, süre ve isabette çalışacak BRANCH gibi alanlar taşır; hasar ve combo hissi buradan gelir.','Attack area. Carries DAMAGE, STUN, size, duration and an on-hit BRANCH; damage and combo feel come from here.','Área de ataque. Lleva DAMAGE, STUN, tamaño, duración y BRANCH al impactar; de aquí sale el daño y la sensación de combo.'),

      STATE:X('Karaktere geçici durum verir (ör. hareket kilidi, dayanıklılık). Alan adlarını node özelliklerinden doğrula.','Gives a temporary character state (e.g. movement lock, armor). Verify field names in node properties.','Da un estado temporal (p. ej. bloqueo de movimiento, armadura). Verifica los campos del nodo.'),

    function glossary(q){
      var hit=Object.keys(GL).filter(function(k){return new RegExp('\\b('+k+'|'+dn(k)+')\\b','i').test(q);});
      if(!hit.length)hit=Object.keys(GL);
      var extra='';
      if(hit.length===1&&SLOTS&&SLOTS.length){
        var tags={},brs={};SLOTS.forEach(function(s){var st=slotStats(s);Object.keys(st.tags).forEach(function(k){tags[k]=1;});st.br.forEach(function(k){brs[k]=1;});});
        if(hit[0]==='TAG')extra='\n\n'+Lx(X('Dosyandaki TAG’ler: ','Tags in your file: ','Tags en tu archivo: '))+(Object.keys(tags).slice(0,20).join(', ')||Lx(H.none));
        if(hit[0]==='BRANCH')extra='\n\n'+Lx(X('Dosyandaki branch’ler: ','Branches in your file: ','Branches en tu archivo: '))+(Object.keys(brs).slice(0,20).join(', ')||Lx(H.none));
      }
      return hit.map(function(k){return '**'+dn(k)+'** — '+Lx(GL[k]);}).join('\n')+extra+'\n\n'+Lx(X('Alan anlamları bağlama göre değişebilir; düzenlemeden önce node özelliklerine bak.','Field meanings can vary by context; inspect node properties before editing.','El significado puede variar según el contexto; revisa las propiedades del nodo.'));
    }
    var KB={
      workflow:X('**Skill nasıl yapılır?**\n1. Rolünü seç: starter, kontrol, finisher ya da hareket.\n2. İskelet: ANIM → WAIT (startup) → HITBOX → WAIT (recovery).\n3. VELO, SFX ve VISUAL ile hissi güçlendir.\n4. TAG + STATE ile cooldown, sayaç ve koşulları ekle.\n5. BRANCH ile isabet/ıskalama veya combo devamını ayır.\n6. Skill Doktoru ile kontrol et, oyunda test et ve sayıları ince ayarla.','**How to build a skill**\n1. Pick its role: starter, control, finisher or movement.\n2. Skeleton: ANIM → WAIT (startup) → HITBOX → WAIT (recovery).\n3. Add feel with VELO, SFX and VISUAL.\n4. Use TAG + STATE for cooldowns, counters and conditions.\n5. Use BRANCH to split hit/miss or combo continuation.\n6. Run Skill Doctor, test in-game, tune the numbers.','**Cómo crear una skill**\n1. Elige el rol: starter, control, finisher o movimiento.\n2. Esqueleto: ANIM → WAIT (inicio) → HITBOX → WAIT (recuperación).\n3. Añade sensación con VELO, SFX y VISUAL.\n4. TAG + STATE para cooldowns, contadores y condiciones.\n5. BRANCH para separar acierto/fallo o continuar el combo.\n6. Usa el Doctor, prueba en el juego y ajusta los números.'),
      m1:X('**M1 combo mantığı**\nTipik yapı: her vuruş ANIM → HITBOX → WAIT. Adım sayacı TAG ile tutulur, BRANCH bir sonraki vuruşa geçirir, son vuruşta sayaç sıfırlanır. Pencere kaçarsa sayaç da sıfırlanmalı; yoksa combo takılı kalır. Son vuruşa daha yüksek STUN/knockback vermek yaygın bir tasarımdır.','**M1 combo logic**\nTypical pattern: each hit is ANIM → HITBOX → WAIT. A TAG keeps the step counter, BRANCH advances to the next hit, and the last hit resets it. If the input window is missed the counter must reset too, or the combo gets stuck. A stronger STUN/knockback on the last hit is a common design.','**Lógica del combo M1**\nPatrón típico: cada golpe es ANIM → HITBOX → WAIT. Un TAG guarda el paso, BRANCH avanza al siguiente golpe y el último lo reinicia. Si se pierde la ventana, el contador también debe reiniciarse. Un último golpe con más STUN/knockback es un diseño común.'),
      theory:X('**Timing ve combo kuralı**\nStartup = vuruşa kadar geçen süre, recovery = vuruştan sonra serbest kalma süresi. Bir skill, rakibin STUN süresi bir sonraki skill’in startup’ından uzunsa combo’ya bağlanır. Düşük startup + kısa recovery güvenli ama düşük hasarlı olmalı; yüksek hasar uzun recovery ile dengelenmeli. Hit-confirm için devamı isabette BRANCH ile aç.','**Timing and combo rule**\nStartup = time until the hit, recovery = time until you act again. A skill links into a combo when the target’s STUN outlasts the next skill’s startup. Low startup + short recovery should mean low damage; high damage should cost long recovery. For hit-confirm, open the follow-up through an on-hit BRANCH.','**Timing y regla de combo**\nStartup = tiempo hasta el golpe, recovery = tiempo hasta actuar de nuevo. Una skill enlaza si el STUN del objetivo supera el startup de la siguiente. Poco startup y poca recovery implica poco daño; mucho daño debe costar mucha recovery. Para hit-confirm, abre la continuación con un BRANCH al impactar.'),
      chars:X('Jujutsu Shenanigans, Jujutsu Kaisen’den esinlenen karakter movesetleri sunar (ör. Gojo, Sukuna, Itadori, Megumi, Nanami, Todo). Güncel kadroyu doğrulayamam; kesin liste için oyundaki seçim ekranına bak. Yüklediğin KLUv movesetini ise detaylı analiz edebilirim.','Jujutsu Shenanigans offers movesets inspired by Jujutsu Kaisen characters (e.g. Gojo, Sukuna, Itadori, Megumi, Nanami, Todo). I can’t verify the current roster; check the in-game selection screen. I can analyze any KLUv moveset you load.','Jujutsu Shenanigans ofrece movesets inspirados en Jujutsu Kaisen (p. ej. Gojo, Sukuna, Itadori, Megumi, Nanami, Todo). No puedo verificar el plantel actual; mira la pantalla de selección. Puedo analizar cualquier moveset KLUv.'),
      kluv:X('**KLUv kodu**\nOyundaki moveset/character block ekranından Export ile alınan sıkıştırılmış veridir. Kodun tamamını, başındaki KLUv ile birlikte kopyalayıp kutuya yapıştır ve Aç’a bas. Açılmazsa kod eksik, kesilmiş veya farklı formatta olabilir.','**KLUv code**\nThe compressed export from the in-game moveset/character block screen. Copy the entire code including the KLUv prefix, paste it in the box and press Open. If it fails, the code may be truncated or in another format.','**Código KLUv**\nExportación comprimida desde la pantalla del moveset/character block. Copia todo el código con el prefijo KLUv, pégalo y pulsa Abrir. Si falla, puede estar incompleto o en otro formato.')

    function findSlot(q){

        [["TIME’ı animasyon uzunluğuna eşitle.", "Match TIME to the animation length."]],
        ["TIME’ı animasyondan kısa bırakmak; rakip animasyon bitmeden serbest kalır.", "Setting TIME shorter than the animation; the target is freed early."],
        "HITBOX (BRANCH TARGET: grab)\n→ GRAB (TIME 1.25)", ["HITBOX", "ANIM", "STATE"]),
      COUNTER: NB("🛡️", "combat", ["Gelen saldırıyı yakalayıp karşılık verir.", "Catches an incoming attack and answers it."],
        ["TIME boyunca açık kalır. ATTACK TYPE2 hangi saldırı türlerini (Melee, Bullet, Domain…) yakalayacağını seçer. Başarılı olunca BRANCH çalışır, BRANCH TARGET saldırgana uygulanır; REFLECT, REMOVE ON HIT ve CONTINUE ince ayardır.", "Stays active for TIME. ATTACK TYPE2 chooses which attack types (Melee, Bullet, Domain…) it catches. On success BRANCH runs and BRANCH TARGET applies to the attacker; REFLECT, REMOVE ON HIT and CONTINUE fine-tune it."],
        [["Counter süresini kısa tut; uzun counter skill’i aşırı güçlü yapar.", "Keep the window short; long counters are overpowered."], ["Başarı efektini BRANCH ile yaz.", "Write the success effect inside the BRANCH."]],
        ["ATTACK TYPE2’yi boş ya da yanlış bırakmak; counter hiçbir saldırıyı yakalamaz.", "Leaving ATTACK TYPE2 empty or wrong; it catches nothing."],
        "COUNTER (TIME 1)\n→ BRANCH c\n   → ANIM + HITBOX", ["HITBOX", "BRANCH", "STATE"]),
      HPGIB: NB("🩸", "combat", ["Karakterin canını değiştirir.", "Changes the character’s health."],
        ["AMOUNT negatifken can azalıyor gibi görünüyor (dosyandaki değerler -2 ile -4.5 arası); alan adlarına göre yorumlanmıştır. CAN KILL açıksa kendi canını sıfıra indirebilir.", "A negative AMOUNT appears to reduce health (values in your file run from -2 to -4.5); interpreted from field names. With CAN KILL on it may take health to zero."],
        [["Can bedeli olan güçlü skill’lerde kullan, CAN KILL’i kapalı tut.", "Use for powerful skills with a health cost; keep CAN KILL off."]],
        ["CAN KILL’i açık bırakıp oyuncuyu kendi skill’iyle öldürtmek.", "Leaving CAN KILL on and letting players kill themselves."],
        "HPGIB (AMOUNT -3)\n→ HITBOX", ["HITBOX", "STATE"]),

        [["SPEED ile animasyonu hızlandırıp startup’ı kısaltabilirsin.", "Raise SPEED to shorten startup."], ["Dosyanda negatif SPEED örnekleri var; bunlar ters oynatma için kullanılıyor olabilir.", "Your file has negative SPEED values; they may play the animation in reverse."]],
        ["ANIM_USE’u boş bırakmak; animasyon oynamaz.", "Leaving ANIM_USE empty; nothing plays."],

        ["FORCE (X, Y, Z) yönünde kuvvet uygular. TIME süreyi, FADE kuvvetin sönmesini, TRACK takip davranışını, RAGDOLL/TRUE RAGDOLL ragdoll geçişini ayarlar.", "Applies force along FORCE (X, Y, Z). TIME sets duration, FADE how force dies out, TRACK following behavior, RAGDOLL/TRUE RAGDOLL the ragdoll switch."],
        [["Y’de 0–2 arası küçük bir değer dash’e hafif kalkış verir.", "A small Y of 0–2 gives a dash a slight lift."], ["Çok yüksek FORCE değerleri duvardan geçme sorunu yaratabilir.", "Very high FORCE can cause wall-clipping."]],

        ["CAMERA DIRECTION açıkken karakter kameranın baktığı yöne döner. HORIZONTAL ONLY yalnızca yatay dönüşü, SMOOTHNESS yumuşatmayı, TIME süreyi belirler.", "With CAMERA DIRECTION on the character faces where the camera looks. HORIZONTAL ONLY limits it to horizontal turns, SMOOTHNESS softens it, TIME sets the duration."],

        "LOOK (CAMERA DIRECTION, TIME 1.1)\n→ HITBOX", ["ANIM", "HITBOX"]),

        ["SIZE, POSITION, ROTATION, COLOR/ALT COLOR, OPACITY ve TEXTURE ile efekti tasarlarsın; EASING geçişleri yumuşatır. CAN COLLIDE ve CANCEL ON INTERRUPT efektin oyuna etkisini belirler.", "Design the effect with SIZE, POSITION, ROTATION, COLOR/ALT COLOR, OPACITY and TEXTURE; EASING smooths transitions. CAN COLLIDE and CANCEL ON INTERRUPT set how it affects the game."],
        [["Küçük başla, sonra büyüt; ekranı kaplayan efekt rakibi gizler.", "Start small, then scale up; screen-filling effects hide the opponent."], ["CANCEL ON INTERRUPT açıksa skill kesilince efekt de kalkar.", "With CANCEL ON INTERRUPT on, the effect ends when the skill is interrupted."]],

        [["Ses ID’sinin oyunda kullanılabilir olduğundan emin ol.", "Make sure the sound ID is usable in the game."], ["Tekrarlayan seslerde START/END ile kısa kesit kullan.", "Use START/END for short clips on repeating sounds."]],
        ["Çok yüksek VOLUME; rahatsız eder ve diğer sesleri bastırır.", "Excessive VOLUME; annoying and drowns out other sounds."],
        "ANIM → SFX (VOLUME 1.5)\n→ WAIT 0.25 → HITBOX", ["VISUAL", "ANIM"]),
      STATE: NB("🧿", "state", ["Karaktere geçici bir durum uygular.", "Applies a temporary state to the character."],
        ["STATE durum adını (DirectionLock, Stun, IFrame, NoSprint…), VALUE şiddet/çarpanı, TIME süreyi belirler. CANCEL ON END süre bitince durumu kaldırır, DISABLE BURST ise burst’ı kapatır.", "STATE names the state (DirectionLock, Stun, IFrame, NoSprint…), VALUE sets strength/multiplier, TIME the duration. CANCEL ON END removes it when time ends, DISABLE BURST turns burst off."],

        TAG: ["Guarda condiciones y contadores con etiquetas.", "TAG lee (CHECK) o escribe (SET) una etiqueta. Con CHECK activo y un valor que coincide, el flujo va al BRANCH. Sirve para contadores, cooldowns, lógica de una sola vez y pasos de combo. TIME hace la etiqueta temporal; inf significa sin caducidad.", ["Para contadores, sube el mismo nombre de TAG paso a paso.", "Una etiqueta con TIME actúa como cooldown."], "Usar sin querer el mismo nombre de TAG para dos fines distintos."],

        VELO: ["Da empuje/velocidad al personaje.", "Aplica fuerza según FORCE (X, Y, Z). TIME es la duración, FADE cómo se apaga la fuerza, TRACK el seguimiento y RAGDOLL/TRUE RAGDOLL el cambio a ragdoll.", ["Una Y pequeña de 0–2 da un ligero impulso vertical al dash.", "Un FORCE muy alto puede atravesar paredes."], "Aplicar fuerza constante mucho tiempo con FADE apagado; el movimiento se descontrola."],
        TELEPORT: ["Mueve al personaje al instante.", "POSITION/ROTATION fijan el nuevo punto, RELATIVE FROM BRANCH el cálculo relativo e IGNORE WALLS la comprobación de paredes.", ["Avisa los teletransportes cortos con VISUAL/SFX."], "Acabar dentro de una pared con IGNORE WALLS activo."],
        LOOK: ["Define la dirección en que mira.", "Con CAMERA DIRECTION el personaje mira hacia donde mira la cámara. HORIZONTAL ONLY limita el giro al plano horizontal, SMOOTHNESS lo suaviza y TIME fija la duración.", ["Úsalo para ligar la dirección del ataque a la puntería del jugador."], "Un TIME muy largo da sensación de perder el control."],
        VISUAL: ["Genera un efecto visual o un modelo.", "Diseña el efecto con SIZE, POSITION, ROTATION, COLOR/ALT COLOR, OPACITY y TEXTURE; EASING suaviza las transiciones. CAN COLLIDE y CANCEL ON INTERRUPT definen cómo afecta al juego.", ["Empieza pequeño y agranda; los efectos que llenan la pantalla ocultan al rival.", "Con CANCEL ON INTERRUPT activo, el efecto termina si se interrumpe la skill."], "Dejar CAN COLLIDE activo; el efecto puede bloquear a los jugadores."],
        PARTICLE: ["Emite un efecto de partículas.", "EMIT COUNT/RATE definen la cantidad, SHAPE/SPREAD ANGLE la dispersión, SPEED/ACCELERATION el movimiento, COLOR/TEXTURE el aspecto y DURATION la vida del efecto.", ["Empieza con pocas partículas; muchas bajan el rendimiento."], "Un efecto que nunca se ve porque DURATION es 0."],
        SFX: ["Reproduce un efecto de sonido.", "ID es el identificador de sonido de Roblox. VOLUME fija el volumen, SPEED velocidad/tono, START/END el fragmento, FADE IN/OUT las transiciones, GLOBAL si todos lo oyen y CLIENT SIDED si solo lo oye el jugador.", ["Asegúrate de que el ID de sonido se pueda usar en el juego.", "Usa START/END para fragmentos cortos en sonidos que se repiten."], "VOLUME excesivo; molesta y tapa otros sonidos."],
        STATE: ["Aplica un estado temporal al personaje.", "STATE nombra el estado (DirectionLock, Stun, IFrame, NoSprint…), VALUE la fuerza/multiplicador y TIME la duración. CANCEL ON END lo quita al terminar el tiempo y DISABLE BURST desactiva el burst.", ["Mantén IFrame corto; la invencibilidad larga rompe el equilibrio.", "Empareja los estados que bloquean el movimiento con el tiempo de recuperación."], "Un TIME largo con CANCEL ON END apagado; el estado puede durar más que la skill."]
      },
      pt: {
        BRANCH: ["Direciona o fluxo para outro caminho (branch).", "Executa a linha guardada sob o nome do campo BRANCH. Permite escrever comportamentos separados (acerto, erro, continuação de combo) sem poluir o fluxo principal.", ["Dê nomes claros aos branches: hit, miss, finisher.", "Use o Doutor de skills para achar e remover branches sem uso."], "Apontar para um branch que não existe; o fluxo pode não fazer nada sem avisar."],
        TAG: ["Guarda condições e contadores com tags.", "TAG lê (CHECK) ou escreve (SET) uma tag. Com CHECK ligado e valor igual, o fluxo vai para o BRANCH. Serve para contadores, cooldowns, lógica de uma vez só e passos de combo. TIME torna a tag temporária; inf significa sem expiração.", ["Para contadores, aumente o mesmo nome de TAG passo a passo.", "Uma tag com TIME age como cooldown."], "Usar sem querer o mesmo nome de TAG para dois fins diferentes."],
        WAIT: ["Pausa o fluxo pelo tempo indicado.", "Seu único campo é TIME. Com ele você ajusta o início (antes do golpe) e a recuperação (depois). Um WAIT muito longo deixa a skill com sensação de travada.", ["Use WAIT de 0.1–0.3 s em movimentos rápidos.", "Equilibre a recuperação com o dano: mais dano pede mais recuperação."], "Não perceber um WAIT acima de 5 segundos (o Doutor de skills avisa)."],
        LOOP: ["Volta e repete nós anteriores.", "LOOP BACK diz quantos nós voltar e LOOP AMOUNT quantas repetições. HOLD pode manter o loop enquanto a tecla é segurada (pelo nome).", ["Sempre coloque um WAIT dentro do loop, ou ele gira rápido demais.", "Em skills de vários golpes, repita o HITBOX em loop em vez de copiá-lo."], "Contar errado o LOOP BACK; os nós errados se repetem."],
        SETMELEE: ["Ajusta a cadeia M1 (corpo a corpo).", "COMBO parece ser o número de golpes e OFFSET de onde a cadeia continua (pelos nomes dos campos). Usado quando skills se conectam à cadeia M1.", ["Depois de mudar, teste a cadeia M1 inteira no jogo."], "Colocar COMBO maior que a cadeia real."],
        HITBOX: ["Área de ataque: dano, stun e comportamento no acerto.", "É o golpe real da skill. DAMAGE define o dano, STUN quanto o alvo fica atordoado e SIZE/POSITION/ROTATION a área. ATTACK TYPE (Melee, Explosion, Domain…) informa a defesas como COUNTER o tipo. BRANCH TARGET escolhe o caminho no acerto.", ["Mantenha o STUN maior que o início da próxima skill; é assim que combos se ligam.", "Mantenha o SIZE próximo da animação; áreas enormes parecem injustas."], "Deixar DAMAGE em 0 sem querer (o Doutor de skills avisa)."],
        PROJECTILE: ["Dispara um projétil ou ataque de área em movimento.", "Leva DAMAGE e STUN como um HITBOX, mas também viaja com SPEED e executa BRANCH COLLIDED no contato. Valores de SIZE muito grandes no seu arquivo mostram que ele também serve para ataques de área (ex.: Domain).", ["Separe o efeito de impacto com BRANCH COLLIDED.", "Ajuste SPEED conforme o tempo que deve levar para chegar."], "Não verificar CANCEL PROJECTILE e REFLECT COUNT; projéteis podem cancelar ou ricochetear sem esperar."],
        GRAB: ["Agarra o alvo e o prende em uma posição.", "BODY PART escolhe a parte de fixação, POSITION/ROTATION o posicionamento em relação a ela e TIME quanto dura o agarre. Costuma vir após um acerto de HITBOX em skills cinematográficas.", ["Iguale TIME à duração da animação."], "Colocar TIME menor que a animação; o alvo é solto antes."],
        COUNTER: ["Captura um ataque recebido e responde.", "Fica ativo por TIME. ATTACK TYPE2 escolhe quais tipos de ataque captura (Melee, Bullet, Domain…). No sucesso o BRANCH roda e o BRANCH TARGET é aplicado ao atacante; REFLECT, REMOVE ON HIT e CONTINUE refinam o efeito.", ["Mantenha a janela curta; counters longos são fortes demais.", "Escreva o efeito de sucesso dentro do BRANCH."], "Deixar ATTACK TYPE2 vazio ou errado; não captura nada."],
        HPGIB: ["Altera a vida do personagem.", "Um AMOUNT negativo parece reduzir a vida (os valores do seu arquivo vão de -2 a -4.5); interpretado pelos nomes dos campos. Com CAN KILL ligado pode levar a vida a zero.", ["Use em skills fortes com custo de vida; deixe CAN KILL desligado."], "Deixar CAN KILL ligado e jogadores morrerem com a própria skill."],
        ANIM: ["Toca uma animação.", "ANIM_USE escolhe a animação; SPEED define a velocidade, FADE IN/OUT as transições e LOOPED a repete. O fluxo pode não esperar a animação sozinho; sincronize com WAIT.", ["Aumente SPEED para encurtar o início.", "Seu arquivo tem SPEED negativos; podem tocar a animação ao contrário."], "Deixar ANIM_USE vazio; nada toca."],
        VELO: ["Dá impulso/velocidade ao personagem.", "Aplica força conforme FORCE (X, Y, Z). TIME é a duração, FADE como a força diminui, TRACK o acompanhamento e RAGDOLL/TRUE RAGDOLL a troca para ragdoll.", ["Um Y pequeno de 0–2 dá um leve impulso vertical ao dash.", "FORCE muito alto pode atravessar paredes."], "Aplicar força constante por muito tempo com FADE desligado; o movimento foge do controle."],
        TELEPORT: ["Move o personagem instantaneamente.", "POSITION/ROTATION definem o novo ponto, RELATIVE FROM BRANCH o cálculo relativo e IGNORE WALLS a checagem de paredes.", ["Sinalize teletransportes curtos com VISUAL/SFX."], "Acabar dentro de uma parede com IGNORE WALLS ligado."],
        LOOK: ["Define a direção do olhar.", "Com CAMERA DIRECTION o personagem olha para onde a câmera olha. HORIZONTAL ONLY limita o giro ao plano horizontal, SMOOTHNESS suaviza e TIME define a duração.", ["Use para ligar a direção do ataque à mira do jogador."], "Um TIME muito longo dá a sensação de perder o controle."],
        VISUAL: ["Gera um efeito visual ou modelo.", "Projete o efeito com SIZE, POSITION, ROTATION, COLOR/ALT COLOR, OPACITY e TEXTURE; EASING suaviza as transições. CAN COLLIDE e CANCEL ON INTERRUPT definem como afeta o jogo.", ["Comece pequeno e aumente; efeitos que cobrem a tela escondem o oponente.", "Com CANCEL ON INTERRUPT ligado, o efeito termina se a skill for interrompida."], "Deixar CAN COLLIDE ligado; o efeito pode bloquear jogadores."],
        PARTICLE: ["Emite um efeito de partículas.", "EMIT COUNT/RATE definem a quantidade, SHAPE/SPREAD ANGLE a dispersão, SPEED/ACCELERATION o movimento, COLOR/TEXTURE a aparência e DURATION a vida do efeito.", ["Comece com poucas partículas; muitas derrubam o desempenho."], "Um efeito que nunca aparece porque DURATION é 0."],
        SFX: ["Toca um efeito sonoro.", "ID é o identificador de som do Roblox. VOLUME define o volume, SPEED velocidade/tom, START/END o trecho, FADE IN/OUT as transições, GLOBAL se todos ouvem e CLIENT SIDED se só o jogador ouve.", ["Confirme que o ID de som pode ser usado no jogo.", "Use START/END para trechos curtos em sons repetidos."], "VOLUME excessivo; incomoda e abafa outros sons."],
        STATE: ["Aplica um estado temporário ao personagem.", "STATE dá o nome do estado (DirectionLock, Stun, IFrame, NoSprint…), VALUE a força/multiplicador e TIME a duração. CANCEL ON END remove ao fim do tempo e DISABLE BURST desativa o burst.", ["Mantenha IFrame curto; invencibilidade longa quebra o equilíbrio.", "Combine estados que travam o movimento com o tempo de recuperação."], "Um TIME longo com CANCEL ON END desligado; o estado pode durar mais que a skill."]
      },
      ru: {
        BRANCH: ["Направляет поток на другой путь (ветку).", "Запускает линию, сохранённую под именем из поля BRANCH. Позволяет описывать отдельное поведение (попадание, промах, продолжение комбо), не перегружая основной поток.", ["Давайте веткам понятные имена: hit, miss, finisher.", "Используйте Доктор навыков, чтобы находить и удалять неиспользуемые ветки."], "Указать несуществующую ветку; поток может молча ничего не делать."],
        TAG: ["Хранит условия и счётчики с помощью тегов.", "TAG читает (CHECK) или записывает (SET) тег. Если CHECK включён и значение совпало, поток идёт в BRANCH. Нужен для счётчиков, перезарядок, логики «один раз» и шагов комбо. TIME делает тег временным; inf — бессрочно.", ["Для счётчиков повышайте одно и то же имя TAG шаг за шагом.", "Тег с TIME работает как перезарядка."], "Случайно использовать одно имя TAG для двух разных целей."],
        WAIT: ["Приостанавливает поток на заданное время.", "Единственное поле — TIME. Им настраивают старт (до удара) и восстановление (после). Слишком долгий WAIT делает навык «залипающим».", ["Для быстрых движений используйте WAIT 0.1–0.3 с.", "Балансируйте восстановление с уроном: больше урона — дольше восстановление."], "Не заметить WAIT дольше 5 секунд (Доктор навыков предупреждает)."],
        LOOP: ["Возвращается назад и повторяет предыдущие узлы.", "LOOP BACK задаёт, на сколько узлов вернуться, LOOP AMOUNT — сколько повторов. HOLD, судя по названию, может держать цикл, пока зажата клавиша.", ["Всегда ставьте WAIT внутрь цикла, иначе он крутится слишком быстро.", "В многоударных навыках зацикливайте HITBOX вместо копирования."], "Неверно посчитать LOOP BACK — повторяются не те узлы."],
        SETMELEE: ["Настраивает цепочку M1 (ближний бой).", "COMBO, похоже, — число ударов, OFFSET — с какого места продолжается цепочка (по названиям полей). Используется при подключении навыков к цепочке M1.", ["После изменения проверьте всю цепочку M1 в игре."], "Указать COMBO больше реальной цепочки."],
        HITBOX: ["Зона атаки: урон, оглушение и поведение при попадании.", "Это сам удар навыка. DAMAGE задаёт урон, STUN — время оглушения цели, SIZE/POSITION/ROTATION — зону. ATTACK TYPE (Melee, Explosion, Domain…) сообщает защитам вроде COUNTER тип удара. BRANCH TARGET выбирает путь при попадании.", ["Держите STUN дольше старта следующего навыка — так связываются комбо.", "Держите SIZE близко к анимации; огромные зоны ощущаются нечестными."], "Случайно оставить DAMAGE равным 0 (Доктор навыков предупреждает)."],
        PROJECTILE: ["Запускает летящий снаряд или атаку по области.", "Несёт DAMAGE и STUN, как HITBOX, но ещё летит со скоростью SPEED и запускает BRANCH COLLIDED при столкновении. Очень большие SIZE в вашем файле показывают, что он годится и для атак по области (например, Domain).", ["Выносите эффект попадания в BRANCH COLLIDED.", "Подбирайте SPEED по времени, за которое снаряд должен долететь."], "Не проверить CANCEL PROJECTILE и REFLECT COUNT: снаряды могут неожиданно отмениться или отразиться."],
        GRAB: ["Захватывает цель и удерживает её в позиции.", "BODY PART выбирает часть для крепления, POSITION/ROTATION — расположение относительно неё, TIME — длительность захвата. Обычно идёт после попадания HITBOX в кинематографичных навыках.", ["Сделайте TIME равным длине анимации."], "Поставить TIME меньше анимации — цель освободится раньше."],
        COUNTER: ["Перехватывает входящую атаку и отвечает.", "Активен в течение TIME. ATTACK TYPE2 выбирает, какие типы атак он ловит (Melee, Bullet, Domain…). При успехе запускается BRANCH, а BRANCH TARGET применяется к атакующему; REFLECT, REMOVE ON HIT и CONTINUE тонко настраивают эффект.", ["Делайте окно коротким; долгие контрприёмы слишком сильны.", "Пишите эффект успеха внутри BRANCH."], "Оставить ATTACK TYPE2 пустым или неверным — ничего не ловится."],
        HPGIB: ["Изменяет здоровье персонажа.", "Отрицательный AMOUNT, похоже, снижает здоровье (в вашем файле значения от -2 до -4.5); трактовка по названиям полей. При включённом CAN KILL может довести здоровье до нуля.", ["Используйте в сильных навыках с ценой здоровья; CAN KILL держите выключенным."], "Оставить CAN KILL включённым — игроки погибают от собственного навыка."],
        ANIM: ["Проигрывает анимацию.", "ANIM_USE выбирает анимацию; SPEED задаёт скорость, FADE IN/OUT — переходы, LOOPED — повтор. Поток может не ждать анимацию сам по себе; синхронизируйте через WAIT.", ["Повысьте SPEED, чтобы сократить старт.", "В вашем файле есть отрицательные SPEED; возможно, они проигрывают анимацию в обратную сторону."], "Оставить ANIM_USE пустым — ничего не проигрывается."],
        VELO: ["Придаёт персонажу толчок/скорость.", "Прикладывает силу по FORCE (X, Y, Z). TIME — длительность, FADE — затухание силы, TRACK — слежение, RAGDOLL/TRUE RAGDOLL — переход в рэгдолл.", ["Небольшой Y 0–2 даёт рывку лёгкий подъём.", "Слишком большой FORCE может пройти сквозь стены."], "Долго прикладывать постоянную силу при выключенном FADE — движение выходит из-под контроля."],
        TELEPORT: ["Мгновенно перемещает персонажа.", "POSITION/ROTATION задают новую точку, RELATIVE FROM BRANCH — относительный расчёт, IGNORE WALLS — проверку стен.", ["Подавайте сигнал перед короткими телепортами через VISUAL/SFX."], "Оказаться внутри стены при включённом IGNORE WALLS."],
        LOOK: ["Задаёт направление взгляда.", "При CAMERA DIRECTION персонаж смотрит туда же, куда камера. HORIZONTAL ONLY ограничивает поворот горизонтальным, SMOOTHNESS сглаживает, TIME задаёт длительность.", ["Используйте, чтобы привязать направление атаки к прицелу игрока."], "Слишком долгий TIME создаёт ощущение потери управления."],
        VISUAL: ["Создаёт визуальный эффект или модель.", "Эффект настраивается через SIZE, POSITION, ROTATION, COLOR/ALT COLOR, OPACITY и TEXTURE; EASING сглаживает переходы. CAN COLLIDE и CANCEL ON INTERRUPT определяют влияние на игру.", ["Начинайте с малого и увеличивайте; эффекты на весь экран скрывают соперника.", "При включённом CANCEL ON INTERRUPT эффект исчезает, если навык прерван."], "Оставить CAN COLLIDE включённым — эффект может блокировать игроков."],
        PARTICLE: ["Испускает эффект частиц.", "EMIT COUNT/RATE задают количество, SHAPE/SPREAD ANGLE — разброс, SPEED/ACCELERATION — движение, COLOR/TEXTURE — вид, DURATION — время жизни эффекта.", ["Начинайте с малого числа частиц; их избыток снижает производительность."], "Эффект не виден, потому что DURATION равен 0."],
        SFX: ["Проигрывает звуковой эффект.", "ID — идентификатор звука Roblox. VOLUME задаёт громкость, SPEED — скорость/высоту, START/END — фрагмент, FADE IN/OUT — переходы, GLOBAL — слышат ли все, CLIENT SIDED — слышит ли только игрок.", ["Убедитесь, что ID звука можно использовать в игре.", "Для повторяющихся звуков берите короткие фрагменты через START/END."], "Слишком большой VOLUME раздражает и заглушает другие звуки."],
        STATE: ["Применяет к персонажу временное состояние.", "STATE называет состояние (DirectionLock, Stun, IFrame, NoSprint…), VALUE — силу/множитель, TIME — длительность. CANCEL ON END снимает его по окончании времени, DISABLE BURST отключает burst.", ["Держите IFrame коротким; долгая неуязвимость ломает баланс.", "Согласуйте состояния, блокирующие движение, со временем восстановления."], "Долгий TIME при выключенном CANCEL ON END — состояние может пережить навык."]
      }
